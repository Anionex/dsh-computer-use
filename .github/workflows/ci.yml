name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: Standalone package and native integrity
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install standalone dependencies
        run: pnpm install --frozen-lockfile

      - name: Check published package layout
        run: pnpm exec vitest run tests/package-layout.spec.ts

      - name: Verify committed universal helper
        run: pnpm run check:native

      - name: Check patch and documentation whitespace
        run: git diff --check
