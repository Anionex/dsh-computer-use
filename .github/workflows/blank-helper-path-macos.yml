name: Validate blank helper path on macOS

# Temporary validation scoped to PR #31; no schedules or release actions.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: blank-helper-path-macos
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'Anionex/dsh-computer-use' && github.event.pull_request.number == 31 && github.head_ref == 'fix/blank-helper-path'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the repository package manager
        run: npm install --global pnpm@11.20.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Rebuild all committed artifacts
        id: build
        run: pnpm run build
      - name: Verify native integrity and target-process routing
        if: success()
        run: pnpm run check:native
      - name: Diagnose fixture launch without native helper actions
        run: |
          mkdir -p "$RUNNER_TEMP/foreground-baseline"
          open "$RUNNER_TEMP/foreground-baseline"
          sleep 2
          cat > "$RUNNER_TEMP/fixture-launch.swift" <<'SWIFT'
          import AppKit
          import Foundation
          let root = CommandLine.arguments[1]
          let transcript = CommandLine.arguments[2]
          func snapshot(_ stage: String) {
              let front = NSWorkspace.shared.frontmostApplication
              let fixtures = NSRunningApplication.runningApplications(withBundleIdentifier: "io.anionex.dsh-computer-use-fixture")
              print(stage, "frontmost", front?.bundleIdentifier ?? "nil", front?.processIdentifier ?? -1,
                    "fixtures", fixtures.map { "\($0.processIdentifier):active=\($0.isActive)" })
              if let data = FileManager.default.contents(atPath: transcript), let text = String(data: data, encoding: .utf8) { print(text) }
          }
          snapshot("before")
          let process = Process()
          process.executableURL = URL(fileURLWithPath: "/usr/bin/open")
          process.arguments = ["-g", "-n", root + "/native/macos/fixture/DSHComputerUseFixture.app", "--args", "--background", "--transcript", transcript]
          try process.run()
          process.waitUntilExit()
          for index in 0..<20 {
              RunLoop.current.run(until: Date().addingTimeInterval(0.25))
              snapshot("sample-\(index)")
          }
          for fixture in NSRunningApplication.runningApplications(withBundleIdentifier: "io.anionex.dsh-computer-use-fixture") { fixture.terminate() }
          SWIFT
          xcrun swift "$RUNNER_TEMP/fixture-launch.swift" "$PWD" "$RUNNER_TEMP/fixture-launch.json"
      - name: Run unit and native tests with mandatory TCC
        if: success()
        env:
          DSH_COMPUTER_USE_REQUIRE_TCC: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/foreground-baseline"
          open "$RUNNER_TEMP/foreground-baseline"
          sleep 2
          swift -e 'import AppKit; let app = NSWorkspace.shared.frontmostApplication; print("Foreground baseline:", app?.bundleIdentifier ?? "none"); guard app?.bundleIdentifier == "com.apple.finder" else { exit(1) }'
          pnpm exec vitest run tests
      - name: Verify package contents
        if: always() && steps.build.outcome == 'success'
        run: pnpm pack --dry-run
      - name: Run the unmodified aggregate validation gate
        if: always() && steps.build.outcome == 'success'
        run: |
          open "$RUNNER_TEMP/foreground-baseline"
          sleep 2
          swift -e 'import AppKit; let app = NSWorkspace.shared.frontmostApplication; print("Foreground baseline:", app?.bundleIdentifier ?? "none"); guard app?.bundleIdentifier == "com.apple.finder" else { exit(1) }'
          pnpm run validate
      - name: Report generated artifact changes
        if: always() && steps.build.outcome == 'success'
        run: |
          git diff --stat -- lib native/macos/bin native/macos/manifest.json
          git diff --check
      - name: Save rebuilt artifacts for synchronization
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-macos-artifacts
          retention-days: 1
          path: |
            lib/
            native/macos/bin/dsh-computer-use-helper
            native/macos/manifest.json
